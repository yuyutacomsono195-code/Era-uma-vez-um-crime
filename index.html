<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Clone - Personalizável</title>
  <style>
    :root {
      /* Cores Padrão (Tema Verde Escuro) */
      --main-color: #00a884;
      --bg-dark: #111b21;
      --panel-bg: #202c33;
      --chat-bg: #0b141a;
      --sent-msg: #005c4b;
      --hover-color: #2a3942;
      --text-main: #e9edef;
      --text-muted: #8696a0;
      --border-color: #222d34;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background-color 0.3s;
    }

    .app-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      background-color: var(--bg-dark);
      color: var(--text-main);
    }

    /* BARRA LATERAL */
    .sidebar {
      width: 30%;
      min-width: 300px;
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      background-color: var(--bg-dark);
    }

    .sidebar-header {
      height: 60px;
      background-color: var(--panel-bg);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: var(--main-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #fff;
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
    }

    .chat-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      gap: 12px;
      cursor: pointer;
      border-bottom: 1px solid var(--border-color);
      transition: background 0.2s;
    }

    .chat-item:hover {
      background-color: var(--panel-bg);
    }

    .chat-item.active {
      background-color: var(--hover-color);
    }

    .chat-info {
      flex: 1;
      overflow: hidden;
    }

    .chat-title {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .chat-title h4 {
      font-size: 16px;
      color: var(--text-main);
    }

    .chat-title .time {
      font-size: 12px;
      color: var(--text-muted);
    }

    .last-message {
      font-size: 14px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ÁREA DO CHAT */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: var(--chat-bg);
    }

    .chat-header {
      height: 60px;
      background-color: var(--panel-bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .header-user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chat-details h3 {
      font-size: 16px;
      color: var(--text-main);
    }

    .chat-details .status {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* PAINEL DE PERSONALIZAÇÃO DE CORES */
    .theme-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0,0,0,0.2);
      padding: 6px 12px;
      border-radius: 20px;
    }

    .theme-controls label {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .color-picker-wrapper {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      background: none;
    }

    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    input[type="color"]::-webkit-color-swatch {
      border: 2px solid var(--text-main);
      border-radius: 50%;
    }

    .preset-btn {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1px solid #fff;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .preset-btn:hover {
      transform: scale(1.2);
    }

    /* MENSAGENS */
    .messages-container {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .message {
      max-width: 65%;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      position: relative;
      word-break: break-word;
      line-height: 1.4;
    }

    .message.received {
      align-self: flex-start;
      background-color: var(--panel-bg);
      color: var(--text-main);
      border-top-left-radius: 0;
    }

    .message.sent {
      align-self: flex-end;
      background-color: var(--sent-msg);
      color: var(--text-main);
      border-top-right-radius: 0;
    }

    .message-time {
      font-size: 10px;
      color: var(--text-muted);
      float: right;
      margin-top: 4px;
      margin-left: 10px;
    }

    /* CAIXA DE TEXTO */
    .chat-input-area {
      background-color: var(--panel-bg);
      padding: 10px 16px;
    }

    #chatForm {
      display: flex;
      gap: 10px;
    }

    #messageInput {
      flex: 1;
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      outline: none;
      background-color: var(--hover-color);
      color: var(--text-main);
      font-size: 15px;
    }

    #messageInput::placeholder {
      color: var(--text-muted);
    }

    #chatForm button {
      background-color: var(--main-color);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: filter 0.2s;
    }

    #chatForm button:hover {
      filter: brightness(0.9);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Lista de Contatos -->
    <aside class="sidebar">
      <header class="sidebar-header">
        <div class="avatar">EU</div>
        <span>Meu Perfil</span>
      </header>
      <div class="chat-list" id="chatList"></div>
    </aside>

    <!-- Conversa Ativa -->
    <main class="chat-area">
      <header class="chat-header">
        <div class="header-user-info">
          <div class="avatar" id="activeAvatar">?</div>
          <div class="chat-details">
            <h3 id="activeName">Carregando...</h3>
            <span class="status" id="activeStatus">online</span>
          </div>
        </div>

        <!-- Seletor de Cores -->
        <div class="theme-controls">
          <label>Tema Customizado:</label>
          <div class="color-picker-wrapper">
            <input type="color" id="themeColorPicker" value="#00a884" title="Escolha qualquer cor">
          </div>
          <!-- Presets rápidos -->
          <button class="preset-btn" style="background: #00a884;" onclick="applyTheme('#00a884')" title="Verde Padrão"></button>
          <button class="preset-btn" style="background: #7289da;" onclick="applyTheme('#7289da')" title="Roxo Discord"></button>
          <button class="preset-btn" style="background: #e1306c;" onclick="applyTheme('#e1306c')" title="Rosa Instagram"></button>
          <button class="preset-btn" style="background: #ff7a00;" onclick="applyTheme('#ff7a00')" title="Laranja"></button>
        </div>
      </header>

      <div class="messages-container" id="messagesContainer"></div>

      <footer class="chat-input-area">
        <form id="chatForm">
          <input type="text" id="messageInput" placeholder="Digite uma mensagem..." autocomplete="off" />
          <button type="submit">Enviar</button>
        </form>
      </footer>
    </main>
  </div>

  <script>
    const defaultContacts = [
      {
        id: '1',
        name: 'Maria Silva',
        avatar: 'MS',
        messages: [{ text: 'Oi! Conseguiu mudar a cor do app?', type: 'received', time: '10:14' }],
        autoReply: 'Ficou ótimo com essa nova cor!'
      },
      {
        id: '2',
        name: 'Lucas Dev',
        avatar: 'LD',
        messages: [{ text: 'Muda a cor aí pra ver como fica', type: 'received', time: '09:30' }],
        autoReply: 'Top! Qualquer cor funciona perfeitamente.'
      }
    ];

    let contacts = JSON.parse(localStorage.getItem('whatsapp_contacts')) || defaultContacts;
    let activeChatId = contacts[0].id;

    const chatList = document.getElementById('chatList');
    const messagesContainer = document.getElementById('messagesContainer');
    const activeName = document.getElementById('activeName');
    const activeAvatar = document.getElementById('activeAvatar');
    const chatForm = document.getElementById('chatForm');
    const messageInput = document.getElementById('messageInput');
    const colorPicker = document.getElementById('themeColorPicker');

    // CONVERTE HEX PARA RGB PARA CRIAR VARIANTES ESCURAS
    function hexToRgb(hex) {
      let c = hex.replace('#', '');
      if (c.length === 3) c = c.split('').map(x => x + x).join('');
      const num = parseInt(c, 16);
      return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
    }

    // APLICA A COR ESCOLHIDA EM TODO O APP
    function applyTheme(hexColor) {
      colorPicker.value = hexColor;
      const rgb = hexToRgb(hexColor);
      
      // Gera uma versão mais escura da cor para o balão de mensagem enviada
      const darkSent = `rgb(${Math.floor(rgb.r * 0.4)}, ${Math.floor(rgb.g * 0.4)}, ${Math.floor(rgb.b * 0.4)})`;

      document.documentElement.style.setProperty('--main-color', hexColor);
      document.documentElement.style.setProperty('--sent-msg', darkSent);

      // Salva a preferência de cor
      localStorage.setItem('whatsapp_theme_color', hexColor);
    }

    // EVANTO DO COLOR PICKER (TODAS AS CORES EXISTENTES)
    colorPicker.addEventListener('input', (e) => {
      applyTheme(e.target.value);
    });

    function saveToStorage() {
      localStorage.setItem('whatsapp_contacts', JSON.stringify(contacts));
    }

    function getCurrentTime() {
      const now = new Date();
      return `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    }

    function renderChatList() {
      chatList.innerHTML = '';
      contacts.forEach(contact => {
        const lastMsg = contact.messages[contact.messages.length - 1];
        const lastText = lastMsg ? lastMsg.text : 'Nenhuma mensagem';
        const lastTime = lastMsg ? lastMsg.time : '';

        const item = document.createElement('div');
        item.className = `chat-item ${contact.id === activeChatId ? 'active' : ''}`;
        item.onclick = () => selectChat(contact.id);

        item.innerHTML = `
          <div class="avatar">${contact.avatar}</div>
          <div class="chat-info">
            <div class="chat-title">
              <h4>${contact.name}</h4>
              <span class="time">${lastTime}</span>
            </div>
            <p class="last-message">${lastText}</p>
          </div>
        `;
        chatList.appendChild(item);
      });
    }

    function selectChat(id) {
      activeChatId = id;
      renderChatList();
      renderMessages();
    }

    function renderMessages() {
      const contact = contacts.find(c => c.id === activeChatId);
      activeName.textContent = contact.name;
      activeAvatar.textContent = contact.avatar;
      messagesContainer.innerHTML = '';

      contact.messages.forEach(msg => {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${msg.type}`;
        msgDiv.innerHTML = `
          <p>${msg.text}</p>
          <span class="message-time">${msg.time}</span>
        `;
        messagesContainer.appendChild(msgDiv);
      });

      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = messageInput.value.trim();
      if (!text) return;

      const contact = contacts.find(c => c.id === activeChatId);
      const currentTime = getCurrentTime();

      contact.messages.push({
        text: text,
        type: 'sent',
        time: currentTime
      });

      messageInput.value = '';
      saveToStorage();
      renderChatList();
      renderMessages();

      setTimeout(() => {
        contact.messages.push({
          text: contact.autoReply,
          type: 'received',
          time: getCurrentTime()
        });
        saveToStorage();
        renderChatList();
        if (activeChatId === contact.id) {
          renderMessages();
        }
      }, 1200);
    });

    // CARREGA TEMA SALVO OU PADRÃO
    const savedTheme = localStorage.getItem('whatsapp_theme_color') || '#00a884';
    applyTheme(savedTheme);

    renderChatList();
    renderMessages();
  </script>
</body>
      </html>
