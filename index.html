<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Web Original</title>
  <style>
    :root {
      --wa-teal: #00a884;
      --wa-header-bg: #f0f2f5;
      --wa-bg-app: #d1d7db;
      --wa-sidebar-bg: #ffffff;
      --wa-chat-bg: #efeae2;
      --wa-border: #e9edef;
      --wa-sent: #d9fdd3;
      --wa-received: #ffffff;
      --wa-text-primary: #111b21;
      --wa-text-secondary: #667781;
      --wa-hover: #f5f6f6;
      --wa-active: #f0f2f5;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--wa-bg-app);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: var(--wa-text-primary);
    }

    /* Faixa verde no topo típica do WhatsApp Web */
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 127px;
      background-color: #00a884;
      z-index: 0;
    }

    .app-container {
      width: 100vw;
      height: 100vh;
      max-width: 1600px;
      max-height: 100%;
      display: flex;
      background-color: #fff;
      z-index: 1;
      box-shadow: 0 6px 18px rgba(11, 20, 26, 0.05);
    }

    /* BARRA LATERAL */
    .sidebar {
      width: 30%;
      min-width: 320px;
      max-width: 450px;
      border-right: 1px solid var(--wa-border);
      display: flex;
      flex-direction: column;
      background-color: var(--wa-sidebar-bg);
    }

    .sidebar-header {
      height: 60px;
      background-color: var(--wa-header-bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-right: 1px solid var(--wa-border);
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #6b7c85;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 500;
      color: #fff;
      font-size: 14px;
      flex-shrink: 0;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--wa-text-secondary);
      font-size: 18px;
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
      transition: background 0.2s;
    }

    .icon-btn:hover {
      background-color: rgba(11, 20, 26, 0.05);
    }

    .search-box {
      background-color: #fff;
      padding: 7px 12px;
      border-bottom: 1px solid var(--wa-border);
    }

    .search-input-wrapper {
      background-color: var(--wa-header-bg);
      border-radius: 8px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      height: 35px;
    }

    .search-input-wrapper input {
      border: none;
      background: transparent;
      outline: none;
      width: 100%;
      padding-left: 8px;
      font-size: 14px;
      color: var(--wa-text-primary);
    }

    .search-input-wrapper input::placeholder {
      color: var(--wa-text-secondary);
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
    }

    .chat-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      gap: 15px;
      cursor: pointer;
      border-bottom: 1px solid var(--wa-border);
      transition: background 0.15s;
    }

    .chat-item:hover {
      background-color: var(--wa-hover);
    }

    .chat-item.active {
      background-color: var(--wa-active);
    }

    .chat-info {
      flex: 1;
      overflow: hidden;
    }

    .chat-title {
      display: flex;
      justify-content: space-between;
      margin-bottom: 3px;
    }

    .chat-title h4 {
      font-size: 16px;
      font-weight: 400;
      color: var(--wa-text-primary);
    }

    .chat-title .time {
      font-size: 12px;
      color: var(--wa-text-secondary);
    }

    .last-message {
      font-size: 14px;
      color: var(--wa-text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ÁREA DE CONVERSA */
    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: var(--wa-chat-bg);
      position: relative;
    }

    .chat-header {
      height: 60px;
      background-color: var(--wa-header-bg);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 15px;
      border-bottom: 1px solid var(--wa-border);
    }

    .chat-details h3 {
      font-size: 16px;
      font-weight: 500;
      color: var(--wa-text-primary);
    }

    .chat-details .status {
      font-size: 13px;
      color: var(--wa-text-secondary);
    }

    /* CONTAINER DE MENSAGENS */
    .messages-container {
      flex: 1;
      padding: 20px 5%;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      background-image: radial-gradient(rgba(11, 20, 26, 0.06) 1px, transparent 0);
      background-size: 12px 12px;
    }

    .message {
      max-width: 65%;
      padding: 6px 9px 8px 9px;
      border-radius: 7.5px;
      font-size: 14.2px;
      position: relative;
      word-break: break-word;
      line-height: 1.4;
      box-shadow: 0 1px 0.5px rgba(11, 20, 26, 0.13);
    }

    .message.received {
      align-self: flex-start;
      background-color: var(--wa-received);
      color: var(--wa-text-primary);
      border-top-left-radius: 0;
    }

    .message.sent {
      align-self: flex-end;
      background-color: var(--wa-sent);
      color: var(--wa-text-primary);
      border-top-right-radius: 0;
    }

    .message-time {
      font-size: 11px;
      color: var(--wa-text-secondary);
      float: right;
      margin-top: 4px;
      margin-left: 12px;
    }

    /* CAMPO DE MENSAGEM */
    .chat-input-area {
      background-color: var(--wa-header-bg);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #chatForm {
      display: flex;
      width: 100%;
      gap: 10px;
      align-items: center;
    }

    #messageInput {
      flex: 1;
      padding: 9px 12px;
      border: 1px solid #fff;
      border-radius: 8px;
      outline: none;
      background-color: #ffffff;
      color: var(--wa-text-primary);
      font-size: 15px;
    }

    #messageInput::placeholder {
      color: var(--wa-text-secondary);
    }

    #chatForm button {
      background-color: var(--wa-teal);
      color: #fff;
      border: none;
      padding: 9px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      transition: filter 0.2s;
    }

    #chatForm button:hover {
      filter: brightness(0.95);
    }

    /* PAINEL DE CONFIGURAÇÕES */
    .settings-panel {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #f0f2f5;
      z-index: 10;
      display: none;
      flex-direction: column;
    }

    .settings-panel.active {
      display: flex;
    }

    .settings-header {
      height: 108px;
      background-color: #008069;
      color: #ffffff;
      display: flex;
      align-items: flex-end;
      padding: 0 20px 18px 20px;
      gap: 20px;
    }

    .settings-header h2 {
      font-size: 19px;
      font-weight: 500;
    }

    .settings-content {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      max-width: 500px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .setting-card {
      background-color: #ffffff;
      padding: 16px;
      border-radius: 8px;
      box-shadow: 0 1px 3px rgba(11, 20, 26, 0.08);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .setting-card h4 {
      font-size: 14px;
      color: #008069;
      font-weight: 500;
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .setting-row input[type="text"] {
      padding: 8px;
      border-radius: 4px;
      border: 1px solid var(--wa-border);
      outline: none;
    }

    .btn-danger {
      background-color: #ea0038;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- BARRA LATERAL -->
    <aside class="sidebar">
      <header class="sidebar-header">
        <div class="user-profile">
          <div class="avatar" id="myAvatar">EU</div>
          <span id="myName" style="font-weight: 500; font-size: 15px;">Meu Nome</span>
        </div>
        <button class="icon-btn" id="openSettingsBtn" title="Configurações">⚙️</button>
      </header>

      <div class="search-box">
        <div class="search-input-wrapper">
          <span>🔍</span>
          <input type="text" placeholder="Pesquisar ou começar uma nova conversa">
        </div>
      </div>

      <div class="chat-list" id="chatList"></div>
    </aside>

    <!-- ÁREA PRINCIPAL -->
    <main class="content-area">
      <!-- CONVERSA ATIVA -->
      <header class="chat-header">
        <div class="avatar" id="activeAvatar">?</div>
        <div class="chat-details">
          <h3 id="activeName">Carregando...</h3>
          <span class="status">visto por último hoje às 12:45</span>
        </div>
      </header>

      <div class="messages-container" id="messagesContainer"></div>

      <footer class="chat-input-area">
        <form id="chatForm">
          <input type="text" id="messageInput" placeholder="Mensagem" autocomplete="off" />
          <button type="submit">Enviar</button>
        </form>
      </footer>

      <!-- TELA DE CONFIGURAÇÕES -->
      <div class="settings-panel" id="settingsPanel">
        <header class="settings-header">
          <button class="icon-btn" id="closeSettingsBtn" style="color: #fff;" title="Voltar">⬅️</button>
          <h2>Configurações</h2>
        </header>

        <div class="settings-content">
          <div class="setting-card">
            <h4>Seu nome</h4>
            <div class="setting-row">
              <input type="text" id="userNameInput" value="Meu Nome" style="width: 100%;" />
            </div>
          </div>

          <div class="setting-card">
            <h4>Iniciais do Perfil</h4>
            <div class="setting-row">
              <input type="text" id="userAvatarInput" maxlength="2" value="EU" style="width: 80px; text-align: center;" />
            </div>
          </div>

          <div class="setting-card">
            <h4>Conversas</h4>
            <div class="setting-row">
              <span>Restaurar mensagens padrão</span>
              <button class="btn-danger" id="resetDataBtn">Restaurar</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const defaultContacts = [
      {
        id: '1',
        name: 'Maria Silva',
        avatar: 'MS',
        messages: [{ text: 'Oi! Tudo bem?', type: 'received', time: '10:14' }],
        autoReply: 'Oi! Tudo ótimo por aqui, e com você?'
      },
      {
        id: '2',
        name: 'Lucas Dev',
        avatar: 'LD',
        messages: [{ text: 'Conseguiu rodar o código?', type: 'received', time: '09:30' }],
        autoReply: 'Sim! Rodou perfeitamente igual ao WhatsApp original.'
      }
    ];

    let contacts = JSON.parse(localStorage.getItem('wa_orig_contacts')) || defaultContacts;
    let activeChatId = contacts[0].id;
    let userSettings = JSON.parse(localStorage.getItem('wa_orig_settings')) || {
      name: 'Meu Nome',
      avatar: 'EU'
    };

    const chatList = document.getElementById('chatList');
    const messagesContainer = document.getElementById('messagesContainer');
    const activeName = document.getElementById('activeName');
    const activeAvatar = document.getElementById('activeAvatar');
    const chatForm = document.getElementById('chatForm');
    const messageInput = document.getElementById('messageInput');

    const settingsPanel = document.getElementById('settingsPanel');
    const openSettingsBtn = document.getElementById('openSettingsBtn');
    const closeSettingsBtn = document.getElementById('closeSettingsBtn');
    const userNameInput = document.getElementById('userNameInput');
    const userAvatarInput = document.getElementById('userAvatarInput');
    const resetDataBtn = document.getElementById('resetDataBtn');
    const myName = document.getElementById('myName');
    const myAvatar = document.getElementById('myAvatar');

    function saveSettings() {
      localStorage.setItem('wa_orig_settings', JSON.stringify(userSettings));
      myName.textContent = userSettings.name;
      myAvatar.textContent = userSettings.avatar;
    }

    function saveContacts() {
      localStorage.setItem('wa_orig_contacts', JSON.stringify(contacts));
    }

    function getCurrentTime() {
      const now = new Date();
      return `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    }

    function renderChatList() {
      chatList.innerHTML = '';
      contacts.forEach(contact => {
        const lastMsg = contact.messages[contact.messages.length - 1];
        const lastText = lastMsg ? lastMsg.text : 'Nenhuma mensagem';
        const lastTime = lastMsg ? lastMsg.time : '';

        const item = document.createElement('div');
        item.className = `chat-item ${contact.id === activeChatId ? 'active' : ''}`;
        item.onclick = () => selectChat(contact.id);

        item.innerHTML = `
          <div class="avatar">${contact.avatar}</div>
          <div class="chat-info">
            <div class="chat-title">
              <h4>${contact.name}</h4>
              <span class="time">${lastTime}</span>
            </div>
            <p class="last-message">${lastText}</p>
          </div>
        `;
        chatList.appendChild(item);
      });
    }

    function selectChat(id) {
      activeChatId = id;
      renderChatList();
      renderMessages();
    }

    function renderMessages() {
      const contact = contacts.find(c => c.id === activeChatId);
      if (!contact) return;

      activeName.textContent = contact.name;
      activeAvatar.textContent = contact.avatar;
      messagesContainer.innerHTML = '';

      contact.messages.forEach(msg => {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${msg.type}`;
        msgDiv.innerHTML = `
          <p>${msg.text}</p>
          <span class="message-time">${msg.time}</span>
        `;
        messagesContainer.appendChild(msgDiv);
      });

      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = messageInput.value.trim();
      if (!text) return;

      const contact = contacts.find(c => c.id === activeChatId);
      const currentTime = getCurrentTime();

      contact.messages.push({
        text: text,
        type: 'sent',
        time: currentTime
      });

      messageInput.value = '';
      saveContacts();
      renderChatList();
      renderMessages();

      setTimeout(() => {
        contact.messages.push({
          text: contact.autoReply,
          type: 'received',
          time: getCurrentTime()
        });
        saveContacts();
        renderChatList();
        if (activeChatId === contact.id) {
          renderMessages();
        }
      }, 1200);
    });

    openSettingsBtn.addEventListener('click', () => {
      settingsPanel.classList.add('active');
    });

    closeSettingsBtn.addEventListener('click', () => {
      settingsPanel.classList.remove('active');
    });

    userNameInput.addEventListener('input', (e) => {
      userSettings.name = e.target.value || 'Meu Nome';
      saveSettings();
    });

    userAvatarInput.addEventListener('input', (e) => {
      userSettings.avatar = (e.target.value || 'EU').toUpperCase();
      saveSettings();
    });

    resetDataBtn.addEventListener('click', () => {
      if (confirm('Restaurar conversas originais?')) {
        contacts = defaultContacts;
        saveContacts();
        renderChatList();
        renderMessages();
      }
    });

    userNameInput.value = userSettings.name;
    userAvatarInput.value = userSettings.avatar;
    saveSettings();

    renderChatList();
    renderMessages();
  </script>
</body>
              </html>
