<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp GB Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <!-- BARRA LATERAL -->
    <aside class="sidebar">
      <header class="sidebar-header">
        <div class="user-profile" id="openProfileBtn">
          <div class="avatar" id="myAvatar">EU</div>
          <div>
            <span id="myName" style="font-weight: 500;">Meu Nome</span>
            <span class="gb-badge">GB PRO</span>
          </div>
        </div>
        <div>
          <button class="icon-btn" id="openGbModsBtn" title="Configurações GB Mods">⚡ GB</button>
        </div>
      </header>

      <div class="note-bar">
        <span>✏️</span>
        <div class="note-bubble" id="sidebarNoteText">
          <em>Sua nota GB aparecerá aqui...</em>
        </div>
      </div>

      <div class="chat-list" id="chatList"></div>
    </aside>

    <!-- PAINEL PERFIL PESSOAL -->
    <div class="side-panel" id="profilePanel">
      <header class="panel-header">
        <button class="icon-btn" id="closeProfileBtn" style="color:#fff;">⬅️</button>
        <h2>Meu Perfil GB</h2>
      </header>

      <div class="panel-content">
        <div class="avatar-upload-wrapper" onclick="document.getElementById('avatarFileInput').click();">
          <div class="avatar" id="myBigAvatar" style="width:100%; height:100%; font-size:36px;">EU</div>
          <div class="avatar-upload-overlay">Mudar Foto</div>
        </div>
        <input type="file" id="avatarFileInput" accept="image/*" style="display:none;">

        <div class="field-card">
          <label>Seu Nome</label>
          <input type="text" id="inputProfileName" value="Meu Nome">
        </div>

        <div class="field-card">
          <label>Seu Número de Telefone</label>
          <input type="text" id="inputProfilePhone" placeholder="+55 (83) 99999-9999">
        </div>

        <div class="field-card">
          <label>Recado / Biografia</label>
          <input type="text" id="inputProfileBio" value="Usando WhatsApp GB!">
        </div>

        <div class="field-card">
          <label>Sua Nota (24 Horas)</label>
          <input type="text" id="inputProfileNote" placeholder="Escreva algo..." maxlength="60">
        </div>
      </div>
    </div>

    <!-- PAINEL DE CONFIGURAÇÕES GB MODS -->
    <div class="side-panel" id="gbModsPanel">
      <header class="panel-header">
        <button class="icon-btn" id="closeGbModsBtn" style="color:#fff;">⬅️</button>
        <h2>GB Mods & Temas</h2>
      </header>

      <div class="panel-content">
        <div class="field-card">
          <label>Cor Principal do GB</label>
          <input type="color" id="gbColorPicker" value="#00a884" style="height:40px; cursor:pointer;">
        </div>

        <div class="field-card">
          <label>Estilo dos Balões de Mensagem</label>
          <select id="bubbleStyleSelect">
            <option value="8px">Padrão Arredondado (8px)</option>
            <option value="20px">Ultra Redondo (20px)</option>
            <option value="0px">Quadrado Clássico (0px)</option>
          </select>
        </div>

        <div class="field-card">
          <label>Fonte do App</label>
          <select id="fontStyleSelect">
            <option value="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Padrão do Sistema</option>
            <option value="'Courier New', Courier, monospace">Monoespaçada (Coder)</option>
            <option value="Georgia, serif">Serifada (Elegante)</option>
          </select>
        </div>
      </div>
    </div>

    <!-- ÁREA PRINCIPAL DO CHAT -->
    <main class="content-area">
      <header class="chat-header" id="chatHeader">
        <div class="avatar" id="activeAvatar">?</div>
        <div class="chat-details">
          <h3 id="activeName">Carregando...</h3>
          <span class="status" id="activePhoneDisplay">+55 (83) 98888-0000</span>
        </div>
      </header>

      <div class="messages-container" id="messagesContainer"></div>

      <footer class="chat-input-area">
        <form id="chatForm">
          <input type="text" id="messageInput" placeholder="Enviar mensagem GB..." autocomplete="off" />
          <button type="submit">Enviar</button>
        </form>
      </footer>

      <!-- PAINEL DADOS DO CONTATO ATIVO -->
      <div class="contact-info-panel" id="contactInfoPanel">
        <header class="sidebar-header">
          <button class="icon-btn" id="closeContactInfoBtn">✖</button>
          <h4 style="font-weight:500;">Dados do Contato</h4>
        </header>
        <div style="padding: 20px;" class="panel-content">
          <div class="field-card">
            <label>Nome do Contato</label>
            <input type="text" id="contactNameInput">
          </div>
          <div class="field-card">
            <label>Número de Telefone</label>
            <input type="text" id="contactPhoneInput" placeholder="+55 (83) 90000-0000">
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
