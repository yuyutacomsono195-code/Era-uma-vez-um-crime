<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Clone do Instagram</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <!-- Cabeçalho -->
    <header class="navbar">
      <h1>InstaClone</h1>
    </header>

    <!-- Feed de Postagens -->
    <main class="feed">
      <article class="post">
        <div class="post-header">
          <div class="avatar"></div>
          <strong>usuario_exemplo</strong>
        </div>
        
        <!-- Área da Foto -->
        <div class="post-image">
          <p>Sua foto aqui</p>
        </div>
        
        <!-- Ações do Post -->
        <div class="post-actions">
          <button class="like-btn" id="likeButton">🤍 Curtir</button>
        </div>
        <div class="post-caption">
          <strong>usuario_exemplo</strong> Aprendendo a programar hoje! 💻🚀
        </div>
      </article>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
