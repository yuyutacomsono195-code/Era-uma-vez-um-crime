<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Clone - Fundo Branco</title>
  <style>
    :root {
      /* Cores Dinâmicas - Padrão Fundo Branco */
      --main-color: #00a884;
      --bg-dark: #ffffff;
      --panel-bg: #f0f2f5;
      --chat-bg: #ffffff;
      --sent-msg: #d9fdd3;
      --received-msg: #f0f2f5;
      --hover-color: #e9edef;
      --text-main: #111b21;
      --text-muted: #667781;
      --border-color: #e9edef;
      --input-bg: #ffffff;
    }

    /* Tema Escuro (Opcional via configurações) */
    body.dark-theme {
      --bg-dark: #111b21;
      --panel-bg: #202c33;
      --chat-bg: #0b141a;
      --sent-msg: #005c4b;
      --received-msg: #202c33;
      --hover-color: #2a3942;
      --text-main: #e9edef;
      --text-muted: #8696a0;
      --border-color: #222d34;
      --input-bg: #2a3942;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text-main);
      transition: background-color 0.3s;
    }

    .app-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      background-color: var(--bg-dark);
    }

    /* BARRA LATERAL */
    .sidebar {
      width: 30%;
      min-width: 320px;
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      background-color: var(--bg-dark);
    }

    .sidebar-header {
      height: 60px;
      background-color: var(--panel-bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: var(--main-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #fff;
      flex-shrink: 0;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 20px;
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
      transition: background 0.2s, color 0.2s;
    }

    .icon-btn:hover {
      background-color: var(--hover-color);
      color: var(--text-main);
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
    }

    .chat-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      gap: 12px;
      cursor: pointer;
      border-bottom: 1px solid var(--border-color);
      transition: background 0.2s;
    }

    .chat-item:hover {
      background-color: var(--panel-bg);
    }

    .chat-item.active {
      background-color: var(--hover-color);
    }

    .chat-info {
      flex: 1;
      overflow: hidden;
    }

    .chat-title {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .chat-title h4 {
      font-size: 16px;
      color: var(--text-main);
    }

    .chat-title .time {
      font-size: 12px;
      color: var(--text-muted);
    }

    .last-message {
      font-size: 14px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ÁREA DO CHAT E CONFIGURAÇÕES */
    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: var(--chat-bg);
      position: relative;
    }

    .chat-header {
      height: 60px;
      background-color: var(--panel-bg);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .chat-details h3 {
      font-size: 16px;
      color: var(--text-main);
    }

    .chat-details .status {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* MENSAGENS */
    .messages-container {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .message {
      max-width: 65%;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      position: relative;
      word-break: break-word;
      line-height: 1.4;
    }

    .message.received {
      align-self: flex-start;
      background-color: var(--received-msg);
      color: var(--text-main);
      border-top-left-radius: 0;
    }

    .message.sent {
      align-self: flex-end;
      background-color: var(--sent-msg);
      color: var(--text-main);
      border-top-right-radius: 0;
    }

    .message-time {
      font-size: 10px;
      color: var(--text-muted);
      float: right;
      margin-top: 4px;
      margin-left: 10px;
    }

    /* CAIXA DE TEXTO */
    .chat-input-area {
      background-color: var(--panel-bg);
      padding: 10px 16px;
    }

    #chatForm {
      display: flex;
      gap: 10px;
    }

    #messageInput {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      outline: none;
      background-color: var(--input-bg);
      color: var(--text-main);
      font-size: 15px;
    }

    #messageInput::placeholder {
      color: var(--text-muted);
    }

    #chatForm button {
      background-color: var(--main-color);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: filter 0.2s;
    }

    #chatForm button:hover {
      filter: brightness(0.9);
    }

    /* TELA DE CONFIGURAÇÕES */
    .settings-panel {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-dark);
      z-index: 10;
      display: none;
      flex-direction: column;
    }

    .settings-panel.active {
      display: flex;
    }

    .settings-header {
      height: 60px;
      background-color: var(--panel-bg);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .settings-content {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .setting-group {
      background-color: var(--panel-bg);
      padding: 16px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border: 1px solid var(--border-color);
    }

    .setting-group h4 {
      font-size: 14px;
      color: var(--main-color);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .setting-row label {
      font-size: 15px;
    }

    .setting-row input[type="text"] {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: var(--input-bg);
      color: var(--text-main);
      outline: none;
    }

    .color-picker-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      background: none;
    }

    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    input[type="color"]::-webkit-color-swatch {
      border: 2px solid var(--text-main);
      border-radius: 50%;
    }

    .preset-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1px solid #ccc;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .preset-btn:hover {
      transform: scale(1.2);
    }

    .btn-danger {
      background-color: #ea0038;
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-danger:hover {
      filter: brightness(0.9);
    }

    /* Toggle Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: .3s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--main-color);
    }

    input:checked + .slider:before {
      transform: translateX(20px);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- BARRA LATERAL -->
    <aside class="sidebar">
      <header class="sidebar-header">
        <div class="user-profile">
          <div class="avatar" id="myAvatar">EU</div>
          <span id="myName">Meu Nome</span>
        </div>
        <button class="icon-btn" id="openSettingsBtn" title="Configurações">⚙️</button>
      </header>
      <div class="chat-list" id="chatList"></div>
    </aside>

    <!-- ÁREA PRINCIPAL -->
    <main class="content-area">
      <!-- PAINEL DE CHAT -->
      <header class="chat-header">
        <div class="avatar" id="activeAvatar">?</div>
        <div class="chat-details">
          <h3 id="activeName">Carregando...</h3>
          <span class="status">online</span>
        </div>
      </header>

      <div class="messages-container" id="messagesContainer"></div>

      <footer class="chat-input-area">
        <form id="chatForm">
          <input type="text" id="messageInput" placeholder="Digite uma mensagem..." autocomplete="off" />
          <button type="submit">Enviar</button>
        </form>
      </footer>

      <!-- PAINEL DE CONFIGURAÇÕES -->
      <div class="settings-panel" id="settingsPanel">
        <header class="settings-header">
          <button class="icon-btn" id="closeSettingsBtn" title="Voltar">⬅️</button>
          <h2>Configurações</h2>
        </header>

        <div class="settings-content">
          <!-- Perfil -->
          <div class="setting-group">
            <h4>Perfil</h4>
            <div class="setting-row">
              <label for="userNameInput">Seu Nome:</label>
              <input type="text" id="userNameInput" value="Meu Nome" />
            </div>
            <div class="setting-row">
              <label for="userAvatarInput">Iniciais do Perfil:</label>
              <input type="text" id="userAvatarInput" maxlength="2" value="EU" style="width: 60px; text-align: center;" />
            </div>
          </div>

          <!-- Aparência -->
          <div class="setting-group">
            <h4>Aparência & Cores</h4>
            <div class="setting-row">
              <label>Cor Principal do App:</label>
              <div class="color-picker-container">
                <input type="color" id="themeColorPicker" value="#00a884">
                <button class="preset-btn" style="background: #00a884;" onclick="applyMainColor('#00a884')"></button>
                <button class="preset-btn" style="background: #7289da;" onclick="applyMainColor('#7289da')"></button>
                <button class="preset-btn" style="background: #e1306c;" onclick="applyMainColor('#e1306c')"></button>
                <button class="preset-btn" style="background: #ff7a00;" onclick="applyMainColor('#ff7a00')"></button>
              </div>
            </div>
            <div class="setting-row">
              <label for="themeToggle">Modo Escuro:</label>
              <label class="switch">
                <input type="checkbox" id="themeToggle">
                <span class="slider"></span>
              </label>
            </div>
          </div>

          <!-- Dados e Reset -->
          <div class="setting-group">
            <h4>Gerenciamento</h4>
            <div class="setting-row">
              <span>Restaurar Conversas Originais:</span>
              <button class="btn-danger" id="resetDataBtn">Restaurar</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const defaultContacts = [
      {
        id: '1',
        name: 'Maria Silva',
        avatar: 'MS',
        messages: [{ text: 'Oi! O fundo branco ficou bem limpo e claro.', type: 'received', time: '10:14' }],
        autoReply: 'Ficou ótimo!'
      },
      {
        id: '2',
        name: 'Lucas Dev',
        avatar: 'LD',
        messages: [{ text: 'Agora está no modo claro padrão.', type: 'received', time: '09:30' }],
        autoReply: 'Top, bem mais fácil de ler durante o dia.'
      }
    ];

    let contacts = JSON.parse(localStorage.getItem('wa_contacts')) || defaultContacts;
    let activeChatId = contacts[0].id;
    let userSettings = JSON.parse(localStorage.getItem('wa_settings')) || {
      name: 'Meu Nome',
      avatar: 'EU',
      color: '#00a884',
      darkMode: false
    };

    const chatList = document.getElementById('chatList');
    const messagesContainer = document.getElementById('messagesContainer');
    const activeName = document.getElementById('activeName');
    const activeAvatar = document.getElementById('activeAvatar');
    const chatForm = document.getElementById('chatForm');
    const messageInput = document.getElementById('messageInput');

    const settingsPanel = document.getElementById('settingsPanel');
    const openSettingsBtn = document.getElementById('openSettingsBtn');
    const closeSettingsBtn = document.getElementById('closeSettingsBtn');
    const userNameInput = document.getElementById('userNameInput');
    const userAvatarInput = document.getElementById('userAvatarInput');
    const themeColorPicker = document.getElementById('themeColorPicker');
    const themeToggle = document.getElementById('themeToggle');
    const resetDataBtn = document.getElementById('resetDataBtn');
    const myName = document.getElementById('myName');
    const myAvatar = document.getElementById('myAvatar');

    function applyMainColor(hexColor) {
      userSettings.color = hexColor;
      themeColorPicker.value = hexColor;
      document.documentElement.style.setProperty('--main-color', hexColor);
      saveSettings();
    }

    function applyDarkMode(isDark) {
      userSettings.darkMode = isDark;
      themeToggle.checked = isDark;
      if (isDark) {
        document.body.classList.add('dark-theme');
      } else {
        document.body.classList.remove('dark-theme');
      }
      saveSettings();
    }

    function saveSettings() {
      localStorage.setItem('wa_settings', JSON.stringify(userSettings));
      myName.textContent = userSettings.name;
      myAvatar.textContent = userSettings.avatar;
    }

    function saveContacts() {
      localStorage.setItem('wa_contacts', JSON.stringify(contacts));
    }

    function getCurrentTime() {
      const now = new Date();
      return `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    }

    function renderChatList() {
      chatList.innerHTML = '';
      contacts.forEach(contact => {
        const lastMsg = contact.messages[contact.messages.length - 1];
        const lastText = lastMsg ? lastMsg.text : 'Nenhuma mensagem';
        const lastTime = lastMsg ? lastMsg.time : '';

        const item = document.createElement('div');
        item.className = `chat-item ${contact.id === activeChatId ? 'active' : ''}`;
        item.onclick = () => selectChat(contact.id);

        item.innerHTML = `
          <div class="avatar">${contact.avatar}</div>
          <div class="chat-info">
            <div class="chat-title">
              <h4>${contact.name}</h4>
              <span class="time">${lastTime}</span>
            </div>
            <p class="last-message">${lastText}</p>
          </div>
        `;
        chatList.appendChild(item);
      });
    }

    function selectChat(id) {
      activeChatId = id;
      renderChatList();
      renderMessages();
    }

    function renderMessages() {
      const contact = contacts.find(c => c.id === activeChatId);
      if (!contact) return;

      activeName.textContent = contact.name;
      activeAvatar.textContent = contact.avatar;
      messagesContainer.innerHTML = '';

      contact.messages.forEach(msg => {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${msg.type}`;
        msgDiv.innerHTML = `
          <p>${msg.text}</p>
          <span class="message-time">${msg.time}</span>
        `;
        messagesContainer.appendChild(msgDiv);
      });

      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = messageInput.value.trim();
      if (!text) return;

      const contact = contacts.find(c => c.id === activeChatId);
      const currentTime = getCurrentTime();

      contact.messages.push({
        text: text,
        type: 'sent',
        time: currentTime
      });

      messageInput.value = '';
      saveContacts();
      renderChatList();
      renderMessages();

      setTimeout(() => {
        contact.messages.push({
          text: contact.autoReply,
          type: 'received',
          time: getCurrentTime()
        });
        saveContacts();
        renderChatList();
        if (activeChatId === contact.id) {
          renderMessages();
        }
      }, 1200);
    });

    openSettingsBtn.addEventListener('click', () => {
      settingsPanel.classList.add('active');
    });

    closeSettingsBtn.addEventListener('click', () => {
      settingsPanel.classList.remove('active');
    });

    userNameInput.addEventListener('input', (e) => {
      userSettings.name = e.target.value || 'Meu Nome';
      saveSettings();
    });

    userAvatarInput.addEventListener('input', (e) => {
      userSettings.avatar = (e.target.value || 'EU').toUpperCase();
      saveSettings();
    });

    themeColorPicker.addEventListener('input', (e) => {
      applyMainColor(e.target.value);
    });

    themeToggle.addEventListener('change', (e) => {
      applyDarkMode(e.target.checked);
    });

    resetDataBtn.addEventListener('click', () => {
      if (confirm('Deseja restaurar as conversas padrões? Suas mensagens atuais serão apagadas.')) {
        contacts = defaultContacts;
        saveContacts();
        renderChatList();
        renderMessages();
        alert('Conversas restauradas!');
      }
    });

    userNameInput.value = userSettings.name;
    userAvatarInput.value = userSettings.avatar;
    applyMainColor(userSettings.color);
    applyDarkMode(userSettings.darkMode);
    saveSettings();

    renderChatList();
    renderMessages();
  </script>
</body>
  </html>
